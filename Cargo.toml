[workspace]
resolver = "2"
members = ["crates/pack", "crates/cli", "crates/setup", "examples/hello"]
default-members = ["crates/pack", "crates/cli", "crates/setup"]

[workspace.package]
edition = "2021"
version = "0.11.5"
license = "MIT"
repository = "https://github.com/usebach/bach-installer"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# GPUI is heavy; optimise dependencies even in debug so the window stays smooth.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Smaller programs: the setup runtime is part of every setup file, so each
# megabyte here is a megabyte in every download. Measured on bach-setup.exe:
# thin LTO 11.2 MB, fat LTO 10.8 MB, fat LTO and opt-level "s" 9.0 MB, with
# the same install speed (see docs/config.md). Panics still unwind.
lto = "fat"
codegen-units = 1
opt-level = "s"

# zstd's C code compresses and decompresses, so it keeps full speed.
[profile.release.package.zstd-sys]
opt-level = 3
