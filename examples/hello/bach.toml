# The example installer. Build it from the repository root:
#
#   cargo build --release
#   copy target\release\hello.exe examples\hello\app\
#   target\release\bach.exe build examples\hello\bach.toml
#
# or run scripts\build-example.ps1, which does all three.
#
# On a Mac, the [macos] section builds Hello's macOS setup app, in a .dmg:
#
#   cargo build --release
#   target/release/bach build examples/hello/bach.toml --platform macos
#
# or run scripts/build-example.sh.

[app]
name = "Hello"
version = "1.0.0"
publisher = "Bach"
description = "A tiny app that says hello."
executable = "hello.exe"
website = "https://github.com/usebach/bach-installer"

[files]
source = "app"

[installer]
output = "../../dist/Hello-Setup-{version}.exe"

[uninstall]
data = ['%APPDATA%\Hello']
data_description = "Hello's settings."

[macos]
source = "app-macos"
executable = "Hello.app"
output = "../../dist/Hello-Setup-{version}.dmg"
data = ["~/Library/Application Support/Hello"]
