# Bach Installer as a GitHub Action: installs the bach command (no Rust needed) and,
# given a config, builds the setup file, signs it, writes the update feed
# and publishes it all as a GitHub release, so installed apps update
# themselves. The whole pipeline for a release, on every push of a tag:
#
#   on:
#     push:
#       tags: ['v*']
#   permissions:
#     contents: write
#   jobs:
#     release:
#       runs-on: windows-latest
#       steps:
#         - uses: actions/checkout@v4
#         # ... build your app into the folder bach.toml's [files] source names ...
#         - uses: usebach/bach-installer@v0
#           with:
#             config: bach.toml
#             release: true
#
# The release's tag (v1.4.0) is the app's version, so there is no second
# place to keep it; bach.toml needs `[updates] github = "owner/repo"`.
# Without `release`, it only builds, and the file is yours to publish:
#
#   - uses: usebach/bach-installer@v0
#     id: bach
#     with:
#       config: bach.toml
#   - uses: actions/upload-artifact@v4
#     with:
#       path: ${{ steps.bach.outputs.setup }}
#
# Pin it like any action: @v0 follows the newest 0.x release, @v0.2 the newest
# 0.2.x, @v0.2.1 never moves. A full commit SHA never moves either: the Bach Installer
# that builds is then the version in that commit's Cargo.toml, so the pinned
# code and the downloaded program always belong together. `version` picks
# another one.
# Works on Windows, macOS and Linux runners; outside Windows the Windows setup
# file keeps Bach Installer's icon (build on windows-latest to apply app.icon). A bach.toml
# with [macos] also builds the macOS setup app: on a macOS runner as a .dmg (and,
# with --sign, signed and notarized), elsewhere as a .zip of the same app.

name: Bach Installer Installer
description: Build modern installers for Windows (Setup.exe) and macOS (a Setup app in a .dmg) from a bach.toml, and publish them as a release your installed app updates from.
author: Bach Installer
branding:
  icon: package
  color: blue

inputs:
  version:
    description: >-
      The Bach Installer version to build with: 0.2.1 for exactly that one, 0.2 or 0 for
      the newest of that line, latest for the newest release, local to use a
      bach that is already on the PATH. Default: the version in the tag you
      pinned the action with (usebach/bach-installer@v0.2 builds with the newest 0.2.x;
      a full commit SHA builds with the version in that commit's Cargo.toml),
      or the latest release for a branch like main.
    required: false
    default: ''
  config:
    description: A bach.toml to build. Leave empty to only install bach.
    required: false
    default: ''
  args:
    description: >-
      More arguments for bach build, like --fast. Written like a command line:
      spaces separate words, and quotes keep a value with spaces in one piece
      (--patch-from "dist/My App 1.0.exe"). Nothing is expanded, backslashes stay
      as they are, and a word can't contain a line break.
    required: false
    default: ''
  app-version:
    description: >-
      The app's version, replacing app.version in bach.toml. "auto" (the
      default) takes it from the tag a workflow runs for (v1.4.0 gives 1.4.0)
      and keeps bach.toml's version on other runs; give a version to set it
      yourself, or an empty string to always keep bach.toml's.
    required: false
    default: auto
  sign-command:
    description: >-
      A PowerShell command that signs the setup file (and the online
      installer, run again) whose path is in
      $env:BACH_SETUP_FILE (for example: signtool sign /fd sha256 /f cert.pfx
      /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256
      $env:BACH_SETUP_FILE). It runs before the update feed is written, so the
      feed carries the signed file's SHA-256. Windows runners only.
    required: false
    default: ''
  notes:
    description: What's new in this version, shown by apps that offer the update. Markdown is fine.
    required: false
    default: ''
  notes-file:
    description: A file with what's new, instead of `notes`.
    required: false
    default: ''
  release:
    description: >-
      true publishes the setup file and latest.json as a GitHub release (the
      tag is created when it doesn't exist). The job needs contents: write.
    required: false
    default: 'false'
  tag:
    description: The release's tag. Default v followed by the app's version.
    required: false
    default: ''
  prerelease:
    description: >-
      true marks the release as a pre-release, which GitHub doesn't serve as
      "latest", so installed apps don't update to it.
    required: false
    default: 'false'
  draft:
    description: true saves the release as a draft instead of publishing it.
    required: false
    default: 'false'
  latest:
    description: >-
      false keeps this release from becoming GitHub's "latest" (for a fix to an
      older line), so installed apps keep following the newest one.
    required: false
    default: 'true'
  compare:
    description: >-
      true compares the new setup file with the one of the latest release
      (bach diff): the files added, removed and changed, and how much bigger or
      smaller it got. The result goes to the job summary and, on a pull request,
      into one comment that later pushes update. Nothing is compared when
      there is no earlier release or its file can't be found. A comment needs
      pull-requests: write; without it (a pull request from a fork) only the
      summary is written.
    required: false
    default: 'false'
  github-token:
    description: The token that publishes the release, writes the comment and looks Bach Installer's releases up.
    required: false
    default: ${{ github.token }}

outputs:
  setup:
    description: The path of the setup file bach build wrote (the Windows one, or the macOS one when bach.toml only has [macos]).
    value: ${{ steps.build.outputs.setup }}
  setup-macos:
    description: The path of the macOS setup file (.dmg or .zip), when bach.toml has [macos].
    value: ${{ steps.build.outputs.setup-macos }}
  web-setup:
    description: The path of the online installer, when bach.toml asks for one (installer.online).
    value: ${{ steps.build.outputs.web-setup }}
  patch:
    description: The path of the update patch, when `args` has --patch-from.
    value: ${{ steps.build.outputs.patch }}
  version:
    description: The version the setup file carries.
    value: ${{ steps.build.outputs.version }}
  feed:
    description: The path of the update feed (latest.json), when bach.toml has [updates].
    value: ${{ steps.feed.outputs.feed }}
  tag:
    description: The release's tag, when `release` is true.
    value: ${{ steps.release.outputs.tag }}
  release-url:
    description: The link to the release, when `release` is true.
    value: ${{ steps.release.outputs.url }}
  bach-version:
    description: The Bach Installer version that was installed.
    value: ${{ steps.install.outputs.bach-version }}

runs:
  using: composite
  steps:
    - name: Pick the Bach Installer version
      id: pick
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        version="$INPUT_VERSION"
        if [ -z "$version" ] && printf '%s' "$ACTION_REF" | grep -Eq '^v?[0-9]+(\.[0-9]+){0,2}$'; then
          # usebach/bach-installer@v0.2 builds with the newest 0.2.x, @v0.2.1 with 0.2.1.
          version="${ACTION_REF#v}"
        elif [ -z "$version" ] && printf '%s' "$ACTION_REF" | grep -Eq '^[0-9a-f]{40}$'; then
          # Pinned to a commit: the Bach Installer of that commit, never a newer one.
          version=$(tr -d '\r' < "$ACTION_PATH/Cargo.toml" | sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([0-9.]*\)".*/\1/p' | head -n 1)
        fi
        if [ "$version" = "local" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          version=""
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install bach (Windows)
      if: runner.os == 'Windows' && steps.pick.outputs.skip != 'true'
      shell: pwsh
      env:
        BACH_VERSION: ${{ steps.pick.outputs.version }}
        BACH_NO_PATH: '1'
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        & "$env:GITHUB_ACTION_PATH/install.ps1"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Join-Path $env:LOCALAPPDATA 'Programs\bach-cli' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

    - name: Install bach (macOS, Linux)
      if: runner.os != 'Windows' && steps.pick.outputs.skip != 'true'
      shell: bash
      env:
        BACH_VERSION: ${{ steps.pick.outputs.version }}
        BACH_INSTALL_DIR: ${{ runner.temp }}/bach
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$BACH_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Report the Bach Installer version
      id: install
      shell: bash
      run: |
        # A step's PATH change only applies to the steps after it.
        if command -v bach >/dev/null 2>&1; then
          echo "bach-version=$(bach --version | sed 's/^bach //')" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the setup file
      id: build
      if: inputs.config != ''
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        ARGS: ${{ inputs.args }}
        APP_VERSION: ${{ inputs.app-version }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        app_version="$APP_VERSION"
        if [ "$app_version" = "auto" ]; then
          app_version=""
          # A tag like v1.4.0 is the version; a tag that isn't one is left alone.
          if [ "$REF_TYPE" = "tag" ] && printf '%s' "$REF_NAME" | grep -Eq '^[vV]?[0-9]'; then
            app_version="$REF_NAME"
          fi
        fi
        # `args` is split like a command line (see scripts/split-args.sh): quotes keep a
        # value with spaces in one piece, and nothing is expanded.
        extra=()
        while IFS= read -r word; do extra+=("$word"); done < <(sh "$ACTION_PATH/scripts/split-args.sh" "$ARGS") || true
        if [ -n "${ARGS//[[:space:]]/}" ] && [ "${#extra[@]}" -eq 0 ]; then
          sh "$ACTION_PATH/scripts/split-args.sh" "$ARGS" >/dev/null || { echo "::error::The args input is not a valid command line: $ARGS"; exit 1; }
        fi
        bach doctor "$CONFIG"
        # The result comes as JSON (stdout), so no wording of bach's text can break this.
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error::jq isn't available on this runner, and the action needs it to read bach's --json result."
          exit 1
        fi
        result="$RUNNER_TEMP/bach-build.json"
        if [ -n "$app_version" ]; then
          bach build "$CONFIG" --app-version "$app_version" --json ${extra[@]+"${extra[@]}"} > "$result" || { cat "$result"; exit 1; }
        else
          bach build "$CONFIG" --json ${extra[@]+"${extra[@]}"} > "$result" || { cat "$result"; exit 1; }
        fi
        cat "$result"
        setup=$(jq -r '.setup // empty' "$result")
        setup_macos=$(jq -r '.setup_macos // empty' "$result")
        # A config that only builds for macOS has no Windows file: the macOS one is then the setup file.
        main="${setup:-$setup_macos}"
        if [ -z "$main" ]; then
          echo "::error::bach build didn't report a setup file."
          exit 1
        fi
        echo "setup=$main" >> "$GITHUB_OUTPUT"
        echo "setup-macos=$setup_macos" >> "$GITHUB_OUTPUT"
        # The online installer, when the config asks for one.
        echo "web-setup=$(jq -r '.online_setup // empty' "$result")" >> "$GITHUB_OUTPUT"
        # The update patch, when `args` has --patch-from.
        echo "patch=$(jq -r '.patch // empty' "$result")" >> "$GITHUB_OUTPUT"
        echo "version=$(jq -r '.version // empty' "$result")" >> "$GITHUB_OUTPUT"

    - name: Sign the setup file
      if: inputs.config != '' && inputs.sign-command != ''
      shell: pwsh
      env:
        BACH_SETUP_FILE: ${{ steps.build.outputs.setup }}
        WEB_SETUP: ${{ steps.build.outputs.web-setup }}
        PATCH_FILE: ${{ steps.build.outputs.patch }}
        SIGN_COMMAND: ${{ inputs.sign-command }}
      run: |
        Invoke-Expression $env:SIGN_COMMAND
        if ($LASTEXITCODE -ne 0) { throw "The sign command failed (exit code $LASTEXITCODE)." }
        # The update patch is a setup file too, and is signed like one.
        if ($env:PATCH_FILE) {
          $env:BACH_SETUP_FILE = $env:PATCH_FILE
          Invoke-Expression $env:SIGN_COMMAND
          if ($LASTEXITCODE -ne 0) { throw "The sign command failed for the update patch (exit code $LASTEXITCODE)." }
        }
        # The online installer is signed with the same command.
        if ($env:WEB_SETUP) {
          $env:BACH_SETUP_FILE = $env:WEB_SETUP
          Invoke-Expression $env:SIGN_COMMAND
          if ($LASTEXITCODE -ne 0) { throw "The sign command failed for the online installer (exit code $LASTEXITCODE)." }
        }

    - name: Write the update feed
      id: feed
      if: inputs.config != ''
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        SETUP: ${{ steps.build.outputs.setup }}
        PATCH: ${{ steps.build.outputs.patch }}
        NOTES: ${{ inputs.notes }}
        NOTES_FILE: ${{ inputs.notes-file }}
        SIGNED: ${{ inputs.sign-command != '' }}
      run: |
        # bach build already wrote latest.json; it is written again when the
        # files were signed (their SHA-256 changed), there are notes to add, or
        # there is an update patch (the rewrite must keep offering it).
        if ! bach inspect "$SETUP" | grep -Eq '^ +Updates '; then
          echo "bach.toml has no [updates], so there is no update feed."
          exit 0
        fi
        # A macOS-only build wrote its feed itself (signed, with the final file's SHA-256).
        case "$SETUP" in
          *.exe) ;;
          *)
            if [ "$SIGNED" = "true" ] || [ -n "$NOTES" ] || [ -n "$NOTES_FILE" ]; then
              echo "::notice::Notes and sign-command apply to the Windows setup file; this build only has a macOS one, so latest.json is as bach build wrote it."
            fi
            echo "feed=$(dirname "$SETUP")/latest.json" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac
        # Windows' bash wants /c/... paths for its own tools.
        if command -v cygpath >/dev/null 2>&1; then setup_unix=$(cygpath -u "$SETUP"); else setup_unix="$SETUP"; fi
        folder=$(dirname "$setup_unix")
        if [ "$SIGNED" = "true" ] || [ -n "$NOTES" ] || [ -n "$NOTES_FILE" ] || [ -n "$PATCH" ]; then
          feed_args=("$SETUP" --config "$CONFIG")
          if [ -n "$NOTES" ]; then
            feed_args+=(--notes "$NOTES")
          elif [ -n "$NOTES_FILE" ]; then
            feed_args+=(--notes-file "$NOTES_FILE")
          fi
          [ -n "$PATCH" ] && feed_args+=(--patch "$PATCH")
          bach feed "${feed_args[@]}"
        fi
        echo "feed=$folder/latest.json" >> "$GITHUB_OUTPUT"

    - name: Compare with the latest release
      id: compare
      if: inputs.config != '' && inputs.compare == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        SETUP: ${{ steps.build.outputs.setup }}
        VERSION: ${{ steps.build.outputs.version }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        WORK_DIR: ${{ runner.temp }}
      run: |
        # Windows' bash wants /c/... paths for its own tools.
        if command -v cygpath >/dev/null 2>&1; then setup=$(cygpath -u "$SETUP"); else setup="$SETUP"; fi
        name=$(basename "$setup")
        # The earlier file is named like this one with another version: Hello-Setup-1.4.0.exe
        # is looked for as Hello-Setup-*.exe. A name without the version is looked for as it is.
        pattern="${name//"$VERSION"/*}"
        tag=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
        if [ -z "$tag" ]; then
          echo "No earlier release to compare with."
          exit 0
        fi
        old_dir="$WORK_DIR/bach-previous"
        rm -rf "$old_dir"; mkdir -p "$old_dir"
        if ! gh release download "$tag" --pattern "$pattern" --dir "$old_dir" >/dev/null 2>&1; then
          echo "::notice::Release $tag has no file named like $pattern, so there is nothing to compare with."
          exit 0
        fi
        old=$(find "$old_dir" -maxdepth 1 -type f -name '*.exe' | head -n 1)
        if [ -z "$old" ]; then
          echo "::notice::Release $tag has no file named like $pattern, so there is nothing to compare with."
          exit 0
        fi
        report="$WORK_DIR/bach-diff.txt"
        if ! bach diff "$old" "$setup" > "$report" 2>&1; then
          echo "::warning::bach diff couldn't compare with release $tag: $(head -n 3 "$report" | tr '\n' ' ')"
          exit 0
        fi
        cat "$report"
        # The report is text from the files themselves: it goes out as escaped HTML in <pre>,
        # so nothing in it can be read as Markdown or HTML.
        escaped=$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' "$report")
        body=$(printf '<!-- bach-diff -->\n### Bach Installer: this setup file against %s\n\n<pre>\n%s\n</pre>\n' "$tag" "$escaped")
        printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$PR_NUMBER" ]; then
          # One comment, updated by every push. A token that can't write comments (a fork's
          # pull request) leaves the summary as the only place.
          existing=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate --jq '[.[] | select(.body | startswith("<!-- bach-diff -->")) | .id][0] // empty' 2>/dev/null | head -n 1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -f body="$body" >/dev/null || echo "::notice::Couldn't update the comment (does the job have pull-requests: write?); the summary has the report."
          else
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null || echo "::notice::Couldn't write the comment (does the job have pull-requests: write?); the summary has the report."
          fi
        fi

    - name: Publish the release
      id: release
      if: inputs.config != '' && inputs.release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        SETUP: ${{ steps.build.outputs.setup }}
        WEB_SETUP: ${{ steps.build.outputs.web-setup }}
        MAC_SETUP: ${{ steps.build.outputs.setup-macos }}
        PATCH_FILE: ${{ steps.build.outputs.patch }}
        FEED: ${{ steps.feed.outputs.feed }}
        VERSION: ${{ steps.build.outputs.version }}
        TAG: ${{ inputs.tag }}
        NOTES: ${{ inputs.notes }}
        NOTES_FILE: ${{ inputs.notes-file }}
        PRERELEASE: ${{ inputs.prerelease }}
        DRAFT: ${{ inputs.draft }}
        LATEST: ${{ inputs.latest }}
        TARGET: ${{ github.sha }}
      run: |
        tag="${TAG:-v$VERSION}"
        # Windows' bash wants /c/... paths for its own file tests.
        if command -v cygpath >/dev/null 2>&1; then
          setup=$(cygpath -u "$SETUP")
          [ -n "$FEED" ] && feed=$(cygpath -u "$FEED") || feed=""
          [ -n "$WEB_SETUP" ] && web=$(cygpath -u "$WEB_SETUP") || web=""
          [ -n "$PATCH_FILE" ] && patch=$(cygpath -u "$PATCH_FILE") || patch=""
          [ -n "$MAC_SETUP" ] && mac=$(cygpath -u "$MAC_SETUP") || mac=""
        else
          setup="$SETUP"; feed="$FEED"; web="$WEB_SETUP"; patch="$PATCH_FILE"; mac="$MAC_SETUP"
        fi
        files=("$setup")
        # The macOS setup file goes with the Windows one (it is the setup file when it is the only one).
        [ -n "$mac" ] && [ -f "$mac" ] && [ "$mac" != "$setup" ] && files+=("$mac")
        [ -n "$web" ] && [ -f "$web" ] && files+=("$web")
        # The feed points at the patch, so the patch has to be in the release.
        [ -n "$patch" ] && [ -f "$patch" ] && files+=("$patch")
        [ -n "$feed" ] && [ -f "$feed" ] && files+=("$feed")

        flags=()
        [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
        [ "$DRAFT" = "true" ] && flags+=(--draft)
        if [ "$PRERELEASE" != "true" ] && [ "$DRAFT" != "true" ]; then
          if [ "$LATEST" = "false" ]; then flags+=(--latest=false); else flags+=(--latest); fi
        fi

        if gh release view "$tag" >/dev/null 2>&1; then
          # Running a release again replaces its files and keeps the rest.
          gh release upload "$tag" "${files[@]}" --clobber
        else
          notes=(--generate-notes)
          [ -n "$NOTES" ] && notes=(--notes "$NOTES")
          [ -z "$NOTES" ] && [ -n "$NOTES_FILE" ] && notes=(--notes-file "$NOTES_FILE")
          gh release create "$tag" "${files[@]}" --title "$tag" --target "$TARGET" "${notes[@]}" "${flags[@]}"
        fi
        url=$(gh release view "$tag" --json url --jq .url)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "url=$url" >> "$GITHUB_OUTPUT"
        {
          echo "### Released $tag"
          echo
          echo "- Setup file: \`$(basename "$setup")\`"
          [ -n "$mac" ] && [ -f "$mac" ] && [ "$mac" != "$setup" ] && echo "- macOS setup file: \`$(basename "$mac")\`"
          [ -n "$web" ] && [ -f "$web" ] && echo "- Online installer: \`$(basename "$web")\`"
          [ ${#files[@]} -gt 1 ] && echo "- Update feed: \`latest.json\`"
          echo "- $url"
        } >> "$GITHUB_STEP_SUMMARY"
