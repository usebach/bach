name: Bug report
description: Something in bach, a setup file or the installer window doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. For a security problem, don't file it here:
        use [private reporting](https://github.com/usebach/bach/security/advisories/new).
  - type: dropdown
    id: part
    attributes:
      label: Where does it happen?
      options:
        - bach build / check / init (the command)
        - Install, update or repair (the setup window)
        - Uninstall
        - Silent mode (/S)
        - Self-update from the app
        - Docs or schema
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead. Paste error text, or a screenshot of the window.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your bach.toml
      description: The smallest config that shows the problem. Remove anything private.
      render: toml
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. bach build
        2. Run the setup file
        3. ...
  - type: input
    id: version
    attributes:
      label: Bach version
      description: Output of `bach --version`, or the commit if you built from source.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version and architecture
      description: For example "Windows 11 23H2, x64". Say which system `bach` runs on if it isn't Windows.
  - type: textarea
    id: log
    attributes:
      label: Output of `bach doctor` and the setup log
      description: The setup log is at `%TEMP%\<id>-setup.log`. Remove anything private.
      render: text
