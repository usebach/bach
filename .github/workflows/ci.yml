# Checks every push to main and every pull request: tests, clippy with
# warnings as errors, a full build of the example installer, and a real
# silent install, update, downgrade, damage and uninstall run of it, so a
# change that breaks setup files is caught before release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The setup window and the installer run on three kinds of Windows: the
  # newest x64 image, Windows on ARM (where the ARM64 runtime is built and
  # tested natively, not only in the release) and the previous Windows Server
  # image. GitHub offers no Windows 10 image any more; windows-2022 is the
  # oldest one, so Windows 10 itself is not tested here.
  check:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, windows-2022]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Reuse earlier build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test the npm package
        shell: pwsh
        run: |
          # The shim that `npm install --global @usebach/cli` puts on PATH.
          node --test npm/cli/test/resolve.test.js
          if ($LASTEXITCODE -ne 0) { throw 'The npm package tests failed.' }

      - name: Build the example installer
        shell: pwsh
        run: |
          ./scripts/build-example.ps1
          target/release/bach.exe inspect dist/Hello-Setup-1.0.0.exe
          if ($LASTEXITCODE -ne 0) { throw "The example installer isn't readable." }

      # The manifests `bach winget` writes, checked by winget itself (the
      # runner has it; windows-11-arm and older images may not).
      - name: Validate the winget manifests
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/test-winget.ps1

      # Every setup file carries the runtime, so its size is every download's
      # size. This keeps it from growing unnoticed; raise the limit on purpose.
      - name: Check the size of the setup runtime
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $size = (Get-Item target/release/bach-setup.exe).Length
          $limit = 9.5MB
          "bach-setup.exe is {0:N2} MB (limit {1:N1} MB)" -f ($size / 1MB), ($limit / 1MB) | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          if ($size -gt $limit) { throw "bach-setup.exe grew past $($limit / 1MB) MB. Find out why, or raise the limit in .github/workflows/ci.yml on purpose." }

      - name: Install, update and remove for real
        shell: pwsh
        run: ./scripts/e2e.ps1 -Profile release

      # install.ps1, against a release made on the spot (no download). It adds
      # the folder to this runner's user PATH, which is thrown away.
      - name: Test install.ps1
        shell: pwsh
        run: ./scripts/test-install.ps1 -Profile release -TouchPath

      # The action and its checks need nothing that depends on the Windows
      # version, so they run once.
      - name: Prepare the action test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # The action runs against the bach just built, as a pinned release would.
          Copy-Item examples/hello/bach.toml examples/hello/bach.ci.toml
          Add-Content examples/hello/bach.ci.toml "`n[updates]`ngithub = `"usebach/bach-installer`"`n"
          "$PWD\target\release" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build with the action
        if: matrix.os == 'windows-latest'
        id: bach
        uses: ./
        with:
          version: local
          config: examples/hello/bach.ci.toml
          # The example also has a [macos] section; this job builds the Windows file.
          args: --platform windows
          app-version: v7.8.9
          notes: CI check of the action

      - name: Check what the action made
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          SETUP: ${{ steps.bach.outputs.setup }}
          FEED: ${{ steps.bach.outputs.feed }}
          VERSION: ${{ steps.bach.outputs.version }}
          BACH_VERSION_OUTPUT: ${{ steps.bach.outputs.bach-version }}
        run: |
          function Check([bool]$ok, [string]$what) {
            if ($ok) { Write-Host "ok    $what" } else { throw "FAIL  $what" }
          }
          Check ($env:VERSION -eq '7.8.9') "the version output is 7.8.9 (it was '$env:VERSION')"
          Check ((Split-Path -Leaf $env:SETUP) -eq 'Hello-Setup-7.8.9.exe') "the setup file carries the tag's version ($env:SETUP)"
          Check (Test-Path $env:SETUP) 'the setup file exists'
          Check ([bool]$env:BACH_VERSION_OUTPUT) 'the Bach version was reported'
          $feed = Get-Content $env:FEED -Raw | ConvertFrom-Json
          Check ($feed.version -eq '7.8.9') 'the feed says 7.8.9'
          Check ($feed.notes -eq 'CI check of the action') 'the feed carries the notes'
          Check ($feed.url -eq 'https://github.com/usebach/bach-installer/releases/download/v7.8.9/Hello-Setup-7.8.9.exe') "the feed points at the tag's download ($($feed.url))"
          Check ($feed.sha256 -eq (Get-FileHash -Algorithm SHA256 $env:SETUP).Hash.ToLower()) "the feed has the file's SHA-256"

  # `bach` itself builds and runs on Linux, and the setup window only on Windows
  # and macOS (the `macos` job below), so Linux tests the crates that don't need a
  # window: the builder, the formats and the install scripts.
  cli:
    name: bach on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Reuse earlier build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        # The whole workspace: bach-setup is a stub off Windows, but its OS-independent
        # tests (and a manifest that builds everywhere) are checked here too.
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The action's `args` input is split by this script.
      - name: Test the action's argument splitting
        run: sh scripts/test-action-args.sh

      # install.sh, the first thing many people run, against a release made on
      # the spot (no download).
      - name: Test install.sh
        run: sh scripts/test-install.sh target/debug/bach

  # The macOS setup runtime and the Setup app, on Apple silicon and on Intel: tests,
  # clippy, the real install, update, repair and removal of the example app
  # (scripts/e2e-macos.sh, in a throwaway HOME), and the install script. The window
  # itself needs a display, which the runners have no one to look at; the silent run
  # does the same work through the same code.
  macos:
    name: macOS (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple silicon
            os: macos-latest
          - name: Intel
            os: macos-15-intel
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Reuse earlier build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # GPUI compiles its shaders with Xcode's Metal toolchain, a separate
      # download in recent Xcode versions; a runner that has it already skips this.
      - name: Make sure the Metal toolchain is there
        run: xcrun -f metal >/dev/null 2>&1 && xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the example installer
        env:
          BACH_NO_DMG_LAYOUT: "1"
        run: |
          scripts/build-example.sh
          target/release/bach inspect dist/Hello-Setup-1.0.0.dmg
          target/release/bach verify dist/Hello-Setup-1.0.0.dmg

      # Every setup app carries the runtime, so its size is every download's
      # size. This keeps it from growing unnoticed; raise the limit on purpose.
      - name: Check the size of the setup runtime
        run: |
          size=$(stat -f %z target/release/bach-setup)
          limit=$((14 * 1024 * 1024))
          echo "bach-setup is $((size / 1024)) KB (limit $((limit / 1024)) KB)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$size" -le "$limit" ] || { echo "bach-setup grew past 14 MB. Find out why, or raise the limit in .github/workflows/ci.yml on purpose."; exit 1; }

      - name: Install, repair, update and remove for real
        run: scripts/e2e-macos.sh release

      # `[updates] signer`, against a self-signed certificate made on the spot
      # and a real Developer ID app of the runner's.
      - name: Check who an update may be signed by
        run: scripts/test-macos-signer.sh

      - name: Test install.sh
        run: sh scripts/test-install.sh target/debug/bach

      - name: Test the action's argument splitting
        run: sh scripts/test-action-args.sh

  # Known vulnerabilities (RustSec), licenses and where crates come from; the
  # rules are in deny.toml.
  supply-chain:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories licenses sources
