# Checks every push to main and every pull request: tests, clippy with
# warnings as errors, a full build of the example installer, and a real
# silent install, update, downgrade, damage and uninstall run of it, so a
# change that breaks setup files is caught before release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Reuse earlier build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the example installer
        shell: pwsh
        run: |
          ./scripts/build-example.ps1
          target/release/bach.exe inspect dist/Hello-Setup-1.0.0.exe
          if ($LASTEXITCODE -ne 0) { throw "The example installer isn't readable." }

      - name: Install, update and remove for real
        shell: pwsh
        run: ./scripts/e2e.ps1 -Profile release
