# Checks every push to main and every pull request: tests, clippy with
# warnings as errors, a full build of the example installer, and a real
# silent install, update, downgrade, damage and uninstall run of it, so a
# change that breaks setup files is caught before release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Reuse earlier build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the example installer
        shell: pwsh
        run: |
          ./scripts/build-example.ps1
          target/release/bach.exe inspect dist/Hello-Setup-1.0.0.exe
          if ($LASTEXITCODE -ne 0) { throw "The example installer isn't readable." }

      - name: Install, update and remove for real
        shell: pwsh
        run: ./scripts/e2e.ps1 -Profile release

      - name: Prepare the action test
        shell: pwsh
        run: |
          # The action runs against the bach just built, as a pinned release would.
          Copy-Item examples/hello/bach.toml examples/hello/bach.ci.toml
          Add-Content examples/hello/bach.ci.toml "`n[updates]`ngithub = `"usebach/bach`"`n"
          "$PWD\target\release" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build with the action
        id: bach
        uses: ./
        with:
          version: local
          config: examples/hello/bach.ci.toml
          app-version: v7.8.9
          notes: CI check of the action

      - name: Check what the action made
        shell: pwsh
        env:
          SETUP: ${{ steps.bach.outputs.setup }}
          FEED: ${{ steps.bach.outputs.feed }}
          VERSION: ${{ steps.bach.outputs.version }}
          BACH_VERSION_OUTPUT: ${{ steps.bach.outputs.bach-version }}
        run: |
          function Check([bool]$ok, [string]$what) {
            if ($ok) { Write-Host "ok    $what" } else { throw "FAIL  $what" }
          }
          Check ($env:VERSION -eq '7.8.9') "the version output is 7.8.9 (it was '$env:VERSION')"
          Check ((Split-Path -Leaf $env:SETUP) -eq 'Hello-Setup-7.8.9.exe') "the setup file carries the tag's version ($env:SETUP)"
          Check (Test-Path $env:SETUP) 'the setup file exists'
          Check ([bool]$env:BACH_VERSION_OUTPUT) 'the Bach version was reported'
          $feed = Get-Content $env:FEED -Raw | ConvertFrom-Json
          Check ($feed.version -eq '7.8.9') 'the feed says 7.8.9'
          Check ($feed.notes -eq 'CI check of the action') 'the feed carries the notes'
          Check ($feed.url -eq 'https://github.com/usebach/bach/releases/download/v7.8.9/Hello-Setup-7.8.9.exe') "the feed points at the tag's download ($($feed.url))"
          Check ($feed.sha256 -eq (Get-FileHash -Algorithm SHA256 $env:SETUP).Hash.ToLower()) "the feed has the file's SHA-256"
