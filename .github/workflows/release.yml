# Releases Bach (the bach builder and the bach-setup runtime), but only
# when you say so.
#
# Start it on GitHub (Actions › Release › Run workflow) or from a terminal:
#
#   gh workflow run release.yml -f bump=minor
#   gh workflow run release.yml -f version=1.0.0
#   gh workflow run release.yml -f bump=minor -f prerelease=true
#   gh workflow run release.yml -f bump=patch -f dry_run=true
#
# It raises the version, writes CHANGELOG.md from the commits since the last
# release, runs the tests and clippy, builds bach-X.Y.Z-windows-x64.zip, the
# bare bach-setup.exe (which `bach` downloads when it runs without one, on
# macOS and Linux CI for example) and the example installer, commits
# "Release vX.Y.Z" to main with a tag, and publishes a GitHub release with
# all of them and their SHA-256. A second job then adds `bach` for macOS and
# Linux to the same release, and once every program is there the npm job
# publishes @usebach/cli (see below). A dry run does everything up to the
# commit and keeps the files as a workflow artifact.
#
# Once every download is on the release, a normal (not pre-, not draft)
# release moves the tags `v<major>` and `v<major>.<minor>` to it, so
# `uses: usebach/bach@v0` and `@v0.2` always get the newest release of their
# line, and `bach`, which the action installs to match. Pre-releases never
# move them.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version, like 1.0.0 (overrides the bump)
        type: string
        required: false
      prerelease:
        description: Mark it as a pre-release (not shown as the latest version)
        type: boolean
        default: false
      draft:
        description: Save the release as a draft instead of publishing it
        type: boolean
        default: false
      dry_run:
        description: Build and write the notes, but don't commit, tag or release
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time; a second one waits for the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    # Only from main, and only when leifiyoo started it (also on a re-run,
    # which GitHub credits to whoever clicked it). Anyone else's run is
    # skipped before a single step runs. Writers could edit this line on a
    # branch, so the repository's rulesets keep main and the v* tags safe too.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'leifiyoo' &&
      github.triggering_actor == 'leifiyoo'
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out main with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The build runs dependencies' build scripts, so the write token
          # isn't left in .git/config for them; only the push step gets it.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Reuse earlier build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Pick the version
        id: version
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          $target = if ($env:EXACT) { $env:EXACT } else { $env:BUMP }
          $version = bun scripts/bump-version.mjs $target
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (git tag --list "v$version") { throw "v$version is already released." }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing Bach $version"

      - name: Write the changelog
        shell: pwsh
        run: |
          bun scripts/release-notes.mjs --version ${{ steps.version.outputs.version }} --write
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the download and the example installer
        shell: pwsh
        run: |
          ./scripts/build-release.ps1
          ./scripts/build-example.ps1
          $zip = "dist/bach-${{ steps.version.outputs.version }}-windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "The zip wasn't built." }
          $example = "dist/Hello-Setup-1.0.0.exe"
          if (-not (Test-Path $example)) { throw "The example installer wasn't built." }
          $runtime = "dist/bach-setup.exe"
          Copy-Item target/release/bach-setup.exe $runtime
          foreach ($file in @($zip, $example, $runtime)) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $file)" | Set-Content -NoNewline "$file.sha256"
          }
          # The Scoop manifest in the repository points at this release.
          $version = "${{ steps.version.outputs.version }}"
          $scoop = Get-Content scoop/bach.json -Raw | ConvertFrom-Json
          $scoop.version = $version
          $scoop.url = "https://github.com/usebach/bach/releases/download/v$version/bach-$version-windows-x64.zip"
          $scoop.hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          ($scoop | ConvertTo-Json -Depth 5) + "`n" | Set-Content -NoNewline -Encoding utf8NoBOM scoop/bach.json

      - name: Keep the dry run's files
        if: inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bach-${{ steps.version.outputs.version }}-dry-run
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
            dist/release-notes.md
            CHANGELOG.md

      - name: Commit and tag the release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md scoop/bach.json npm/cli/package.json
          git commit -m "Release v$version"
          if ($LASTEXITCODE -ne 0) { throw "Couldn't commit the release." }
          git tag -a "v$version" -m "Bach $version"
          # The token goes in a one-off header, never into .git/config or a URL.
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          # Keep the branch and tag in sync: a partial push would leave a
          # release tag pointing at a commit that never reached main.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push --atomic origin HEAD:main "v$version"
          if ($LASTEXITCODE -ne 0) { throw "Couldn't push the release commit. Did main move while this ran?" }

      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $flags = @()
          if ($env:DRAFT -eq 'true') { $flags += '--draft' }
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create "v$version" `
            "dist/bach-$version-windows-x64.zip" `
            "dist/bach-$version-windows-x64.zip.sha256" `
            "dist/bach-setup.exe" `
            "dist/bach-setup.exe.sha256" `
            "dist/Hello-Setup-1.0.0.exe" `
            "dist/Hello-Setup-1.0.0.exe.sha256" `
            --title "Bach $version" `
            --notes-file dist/release-notes.md `
            @flags
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # `bach` itself runs anywhere; these builds let macOS and Linux (and their
  # CI) use it without Rust. Built from the release tag, then added to the
  # release the job above published.
  cli:
    name: bach for ${{ matrix.name }}
    needs: release
    if: ${{ !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and pack bach
        shell: bash
        run: |
          cargo build --release -p bach-cli --target ${{ matrix.target }}
          name="bach-${{ needs.release.outputs.version }}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/bach" LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Add it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="bach-${{ needs.release.outputs.version }}-${{ matrix.name }}"
          gh release upload "v${{ needs.release.outputs.version }}" "dist/$name.tar.gz" "dist/$name.tar.gz.sha256" --repo "${{ github.repository }}"

  # bach and bach-setup for Windows on ARM, built natively.
  windows-arm64:
    name: bach for windows-arm64
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build and pack bach
        shell: pwsh
        run: |
          cargo build --release -p bach-cli -p bach-setup
          if ($LASTEXITCODE -ne 0) { throw 'The ARM64 build failed.' }
          $name = "bach-${{ needs.release.outputs.version }}-windows-arm64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/bach.exe, target/release/bach-setup.exe, LICENSE -Destination "dist/$name"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline "dist/$name.zip.sha256"

      - name: Add it to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "bach-${{ needs.release.outputs.version }}-windows-arm64"
          gh release upload "v${{ needs.release.outputs.version }}" "dist/$name.zip" "dist/$name.zip.sha256" --repo "${{ github.repository }}"

  # `npm install --global @usebach/cli`: the programs the jobs above put on the
  # release go into one npm package per platform (@usebach/cli-<platform>)
  # and the package people install (@usebach/cli), so npm and the GitHub
  # release can never disagree. It publishes with provenance. It needs the
  # NPM_TOKEN secret (an npm automation token for the @usebach scope); without
  # it the job says so and the release carries on. A version that is already
  # on npm is skipped, so running the failed job again is safe.
  npm:
    name: Publish to npm
    needs: [release, cli, windows-arm64]
    if: ${{ !inputs.dry_run && !inputs.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Say so when there is no npm token
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: echo "::warning::The NPM_TOKEN secret isn't set, so @usebach/cli was not published to npm. Add the secret, then run this job again."

      - name: Install Bun
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Node.js
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download the release's programs
        if: ${{ env.HAS_TOKEN == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/dl
          gh release download "v$VERSION" --repo "${{ github.repository }}" --dir dist/dl --pattern "bach-$VERSION-*"
          (cd dist/dl && sha256sum --check --strict ./*.sha256)
          # The release says windows and macos; npm says win32 and darwin.
          for pair in windows-x64:win32-x64 windows-arm64:win32-arm64 linux-x64:linux-x64 linux-arm64:linux-arm64 macos-x64:darwin-x64 macos-arm64:darwin-arm64; do
            from="${pair%%:*}"; to="${pair##*:}"
            mkdir -p "dist/bin/$to"
            case "$from" in
              windows-*) unzip -q -j -o "dist/dl/bach-$VERSION-$from.zip" -d "dist/bin/$to" ;;
              *) tar -xzf "dist/dl/bach-$VERSION-$from.tar.gz" -C "dist/bin/$to" --strip-components=1 ;;
            esac
          done

      - name: Build the packages
        if: ${{ env.HAS_TOKEN == 'true' }}
        run: bun scripts/build-npm.mjs --version "$VERSION" --binaries dist/bin --out dist/npm

      - name: Publish the packages
        if: ${{ env.HAS_TOKEN == 'true' }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Pre-releases go under the "next" tag, so `npm install` keeps
          # giving people the newest stable version.
          tag=latest
          if [ "$PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then tag=next; fi
          # The platform packages first: the main package depends on them.
          for name in cli-win32-x64 cli-win32-arm64 cli-linux-x64 cli-linux-arm64 cli-darwin-x64 cli-darwin-arm64 cli; do
            package="@usebach/$name"
            if [ -n "$(npm view "$package@$VERSION" version 2>/dev/null)" ]; then
              echo "$package@$VERSION is already on npm."
              continue
            fi
            npm publish "dist/npm/tarballs/usebach-$name-$VERSION.tgz" --access public --provenance --tag "$tag"
          done

  # The action installs the Bach version of the tag it is pinned with, so
  # these two tags are what makes @v0 and @v0.2 follow new releases. They move
  # last, once every download is on the release: a failed build elsewhere
  # leaves them where they were.
  tags:
    name: Move the version tags
    needs: [release, cli, windows-arm64]
    if: ${{ !inputs.dry_run && !inputs.prerelease && !inputs.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Move v<major> and v<major>.<minor>
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*-*) echo "No moving tags for $VERSION."; exit 0 ;;
          esac
          major="${VERSION%%.*}"
          rest="${VERSION#*.}"
          minor="${rest%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          for tag in "v$major" "v$major.$minor"; do
            git tag -f -a "$tag" -m "Bach $VERSION" "v$VERSION^{commit}"
            # The token goes in a one-off header, never into .git/config or a URL.
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push --force origin "refs/tags/$tag"
            echo "$tag now points at v$VERSION"
          done
