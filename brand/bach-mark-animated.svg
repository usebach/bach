<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="-160 -160 320 320" fill="currentColor">
  <title>Bach</title>
  <style>
    /* Twelve petals, lengths after the B-A-C-H motif. Each one flips across its own
       axis on a 2.4 s cycle (squash flat, reopen mirrored, grow 20% and drift
       outward, flip back, rest), cascading 40 ms apart clockwise from the top. */
    .p { transform-box: fill-box; transform-origin: center;
         animation: flip 2.4s cubic-bezier(.55,0,.3,1) infinite; }
    @keyframes flip {
      0%   { transform: translate(0, 0) scale(1, 1); }
      32%  { transform: translate(9px, 0) scale(1.2, -1); }
      62%  { transform: translate(0, 0) scale(1, 1); }
      100% { transform: translate(0, 0) scale(1, 1); }
    }
    @media (prefers-reduced-motion: reduce) { .p { animation: none; } }
  </style>
  <g transform="rotate(-150)"><path class="p" style="animation-delay:0.40s" d="M34.462 7.851L84.538 17.664A18 18 0 1 0 84.538 -17.664L34.462 -7.851A8 8 0 0 0 34.462 7.851Z"/></g>
