[package]
name = "bach-setup"
description = "The setup runtime: the installer and uninstaller window every Bach Installer setup file runs."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bach-setup"
path = "src/main.rs"

[dependencies]
bach-pack = { path = "../pack" }
anyhow.workspace = true
# Not Windows-only: tests in support.rs read manifests from JSON on every OS.
serde_json.workspace = true

# The runtime is a Windows and macOS program; elsewhere it builds to a stub that says so,
# so `cargo test --workspace` still works on every OS.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
gpui = "0.2.2"
# GPUI already builds it; used to cut a panel picture to its panel's shape.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
futures = "0.3"
rfd = "0.18"
raw-window-handle = "0.6"
# debug-embed: always embed the fonts and icons, so a debug build is as
# self-contained as a release.
rust-embed = { version = "8", features = ["debug-embed"] }
sha2 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# A subset of the features GPUI already builds, so they add no compile time.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_System_JobObjects",
    # Not used here: bach-cli needs it, and a feature only one of the two asks
    # for would build bach-setup differently when both are built together,
    # which build-release.ps1 would then reject.
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.100"
# Not used here: the zip crate (bach-cli) asks for this feature of windows-sys, and a feature only one
# of the two asks for would build bach-setup differently when both are built together, which
# build-release.ps1 would then reject. Asking for it here keeps the two builds the same program.
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
