[package]
name = "bach-cli"
description = "The bach command: turns a bach.toml and a folder of files into a modern Windows installer."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bach"
path = "src/main.rs"

[dependencies]
bach-pack = { path = "../pack" }
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde_json.workspace = true
sha2 = "0.10"

# Writing the setup file's icon and version details uses Windows' own
# resource updater; elsewhere the builder skips that step and says so.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
